# Dev override: the gateway rebuilds and restarts on every save (air), inside
# the same network as the lab, so routes.yaml works unchanged (users,
# orders-1..3, products resolve through Docker DNS).
#
#   make dev    ==    docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up --build
#
# The repo is bind-mounted at /src. Module and build caches live in named
# volumes so rebuilds stay fast. Backends are NOT live-reloaded.
services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args: !reset null
    command: ["-c", ".air.toml"]
    working_dir: /src
    volumes:
      - ..:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build

volumes:
  gomod:
  gocache:
