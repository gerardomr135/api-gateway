# The lab (M0): one toysvc image, run as several services with different flags.
# Use the flags to inject failure on demand, e.g. add "-latency=2s" or
# "-fail-rate=0.5" to an instance, then `make lab-up` again.
#
# Ports are published to localhost so you can curl backends directly and
# compare what they receive with and without the gateway in front.

x-toysvc: &toysvc
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      TARGET: toysvc
  restart: unless-stopped

services:
  users:
    <<: *toysvc
    command: ["-name=users", "-port=9001"]
    ports: ["9001:9001"]

  # Three instances of orders for load balancing (M7). They all listen on
  # 9002 inside their own container; only orders-1 is published to the host.
  orders-1:
    <<: *toysvc
    command: ["-name=orders-1", "-port=9002"]
    ports: ["9002:9002"]
  orders-2:
    <<: *toysvc
    command: ["-name=orders-2", "-port=9002"]
  orders-3:
    <<: *toysvc
    command: ["-name=orders-3", "-port=9002"]

  products:
    <<: *toysvc
    command: ["-name=products", "-port=9003"]
    ports: ["9003:9003"]

  # (M5) Toy identity provider: mints RS256 tokens (POST /token?sub=alice) and
  # publishes its public keys at /.well-known/jwks.json, which the gateway
  # fetches (auth.jwks_url in routes.yaml). -retire-after must be >= the token
  # lifetime (-ttl, default 15m), or tokens minted just before a rotation lose
  # their key before they expire. Rotate with: curl -X POST localhost:9100/rotate
  authsvc:
    <<: *toysvc
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TARGET: authsvc
    command: ["-port=9100", "-retire-after=20m"]
    ports: ["9100:9100"]
    # The gateway fetches the JWKS at startup and refuses to start without it,
    # so it waits for this to be healthy (busybox wget ships with alpine).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9100/.well-known/jwks.json"]
      interval: 2s
      timeout: 2s
      retries: 15

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TARGET: gateway
    command: ["-config=/configs/routes.yaml"]
    # No signing secret here: routes.yaml uses RS256, so the gateway only holds
    # public keys. (For HS256, set auth.secret_env and pass that variable.)
    volumes: ["../configs:/configs:ro"]
    ports: ["8080:8080", "9090:9090"]
    depends_on:
      users: {condition: service_started}
      orders-1: {condition: service_started}
      orders-2: {condition: service_started}
      orders-3: {condition: service_started}
      products: {condition: service_started}
      authsvc: {condition: service_healthy}

  # (M10) Observability stack: add jaeger, prometheus and grafana here.
